<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beauty-Grid ERP</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#fff; --blush:#F8EFEC; --blush2:#F2E3DE; --ink:#2B2728; --ink-soft:#766A6A; --rose:#C48A80; --gold:#B4935A;
    --line:#EADBD6; --ok:#3E8E6A; --warn:#C07A2C; --bad:#B4505A;
    --display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--field);color:var(--ink);font-family:var(--body);font-size:15px}
  h1,h2,h3{font-family:var(--display);font-weight:500;margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* layout */
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:var(--blush);border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
  .brand img{width:34px;height:34px;object-fit:contain}
  .brand b{font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:14px}
  .brand small{display:block;color:var(--ink-soft);font-size:11px;letter-spacing:0}
  nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:14.5px;margin-bottom:2px}
  nav a:hover{background:var(--blush2)}
  nav a.on{background:var(--ink);color:#fff}
  nav a i{font-style:normal;width:18px;text-align:center}
  main{padding:22px 26px 80px;min-width:0}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .top h1{font-size:22px;flex:1}
  .who{font-size:12.5px;color:var(--ink-soft)}
  .demo-banner{background:#FFF6E8;border:1px solid #F1D9B5;color:#7A5320;border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:16px}

  /* controls */
  .btn{border:0;border-radius:12px;padding:10px 16px;background:var(--ink);color:#fff;cursor:pointer;font-weight:500;white-space:nowrap}
  .btn.soft{background:var(--blush);color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid #E7C4C8}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
  select,input,textarea{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fff;width:100%}
  select:focus,input:focus,textarea:focus{outline:2px solid #C48A8055;border-color:var(--rose)}
  .sel-producer{width:auto;min-width:180px;background:var(--blush)}
  label.f{display:grid;gap:5px;font-size:13px;color:var(--ink-soft)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* cards & tables */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--blush);border-radius:16px;padding:14px 16px}
  .kpi span{font-size:12.5px;color:var(--ink-soft)}
  .kpi b{display:block;font-family:var(--display);font-weight:500;font-size:24px;margin-top:4px}
  .kpi.alert b{color:var(--bad)}
  .card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;background:#fff}
  .card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .card h2 .sp{flex:1}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:right;font-weight:500;color:var(--ink-soft);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:10px;border-bottom:1px solid #F3E9E6;vertical-align:middle}
  .tbl tr:hover td{background:#FDF8F6}
  .tbl .num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
  .tbl .act{text-align:left;white-space:nowrap}
  .scroll{overflow-x:auto}
  .empty{color:var(--ink-soft);text-align:center;padding:26px 10px;font-size:14px}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--blush);white-space:nowrap}
  .pill.ok{background:#E3F2EA;color:var(--ok)} .pill.warn{background:#FBEEDD;color:var(--warn)} .pill.bad{background:#F7E1E3;color:var(--bad)}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{max-width:260px}
  .bars{display:grid;gap:8px}
  .bars .r{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
  .bars .t{height:10px;border-radius:6px;background:var(--blush);overflow:hidden}
  .bars .t i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:6px}

  /* modal */
  .modal{position:fixed;inset:0;background:#2B272855;display:grid;place-items:center;z-index:20;padding:16px}
  .sheet{background:#fff;border-radius:20px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px}
  .sheet h3{font-size:18px;margin-bottom:14px}
  .sheet .fields{display:grid;gap:12px}
  .sheet .foot{display:flex;gap:8px;margin-top:18px}
  .lines{display:grid;gap:8px}
  .line{display:grid;grid-template-columns:1fr 90px 100px 34px;gap:6px;align-items:center}
  .err{color:var(--bad);font-size:13px;margin-top:10px;white-space:pre-line}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:30}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;background:var(--blush);padding:16px}
  .login .sheet{max-width:380px}

  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;padding:6px;z-index:10;border:0;border-top:1px solid var(--line)}
    .brand{display:none}
    nav{display:flex;overflow-x:auto;gap:2px}
    nav a{flex-direction:column;gap:2px;font-size:11px;padding:7px 9px;white-space:nowrap;margin:0}
    main{padding:16px 14px 100px}
    .kpis{grid-template-columns:1fr 1fr}
    .cols,.grid2{grid-template-columns:1fr}
    .bars .r{grid-template-columns:90px 1fr 80px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
