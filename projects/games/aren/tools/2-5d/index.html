<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>آرين: سليل الحارس العظيم — نسخة 2.5D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--lime:#F6EEDC;--mud:#B5703F;--ochre:#E9A91F;--henna:#A8321E;--indigo:#1E2F8F;--turq:#12A39B;--kohl:#151211}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--kohl);font-family:Cairo,sans-serif;color:var(--lime)}
  #game{position:fixed;inset:0}
  #hud{position:fixed;top:12px;right:14px;left:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-family:Lalezar;font-size:24px;text-shadow:2px 2px 0 var(--kohl)}
  #hearts{color:var(--henna);letter-spacing:4px}
  #hearts span.off{color:#3a2a26}
  #shards{color:var(--turq)}
  #title{position:fixed;top:44px;right:14px;font-family:Lalezar;font-size:15px;opacity:.75;pointer-events:none;text-shadow:1px 1px 0 var(--kohl)}
  #toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);background:var(--kohl);border:3px solid var(--ochre);padding:8px 18px;border-radius:6px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
  #dlg{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);width:min(680px,92vw);background:var(--lime);color:var(--kohl);border:4px solid var(--kohl);box-shadow:6px 6px 0 var(--henna);padding:14px 20px 12px;border-radius:4px;cursor:pointer}
  #dlg.hidden{display:none}
  #dlg .who{font-family:Lalezar;font-size:22px;color:var(--henna);margin-bottom:2px}
  #dlg .txt{font-size:18px;line-height:1.7;min-height:3.4em}
  #dlg .next{font-size:13px;opacity:.6;text-align:left}
  #end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(21,18,17,.82)}
  #end h1{font-family:Lalezar;font-size:clamp(34px,7vw,64px);margin:0;color:var(--ochre);text-shadow:4px 4px 0 var(--henna)}
  #end button{font-family:Lalezar;font-size:24px;padding:8px 28px;background:var(--turq);color:var(--lime);border:3px solid var(--lime);border-radius:4px;cursor:pointer}
  #touch{position:fixed;inset:auto 0 0 0;height:150px;display:none;pointer-events:none}
  #touch .pad{position:absolute;bottom:22px;display:flex;gap:14px;pointer-events:auto}
  #touch .l{left:18px} #touch .r{right:18px}
  #touch button{width:70px;height:70px;border-radius:50%;border:3px solid var(--lime);background:rgba(21,18,17,.45);color:var(--lime);font-family:Lalezar;font-size:20px;touch-action:none}
  #touch button.big{width:80px;height:80px;background:rgba(168,50,30,.6)}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div id="hearts"></div><div id="shards" dir="ltr">◆ 0 / 3</div></div>
<div id="title">آرين: سليل الحارس العظيم · الفصل الأول</div>
<div id="toast"></div>
<div id="dlg" class="hidden"><div class="who"></div><div class="txt"></div><div class="next">اضغط للمتابعة ◂</div></div>
<div id="end"><h1>انتهى الفصل الأول</h1><button id="again">العب مرة أخرى</button></div>
<div id="touch">
  <div class="pad l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="pad r"><button data-k="attack">ضرب</button><button data-k="jump" class="big">قفز</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- setup ----------
const C={lime:0xF6EEDC,mud:0xB5703F,ochre:0xE9A91F,henna:0xA8321E,indigo:0x1E2F8F,turq:0x12A39B,kohl:0x151211,sand:0xE3B567};
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,.1,300);
let camDist=17;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();camDist=w/h<1?28:17;}
addEventListener('resize',resize);resize();

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

// sky + fog
scene.background=canvasTex(2,256,(g)=>{const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#1E2F8F');gr.addColorStop(.42,'#6e3466');gr.addColorStop(.72,'#d0603a');gr.addColorStop(1,'#E9A91F');g.fillStyle=gr;g.fillRect(0,0,2,256);});
scene.fog=new THREE.Fog(0xc25c3c,28,100);

// lights
scene.add(new THREE.HemisphereLight(0xffd9a0,0x3a2a6a,.75));
const sun=new THREE.DirectionalLight(0xffc68a,1.05);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:12,bottom:-8,near:1,far:60});
scene.add(sun,sun.target);

// sun disc + stars
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(8,48),new THREE.MeshBasicMaterial({color:0xF2B33D,fog:false}));
sunDisc.position.set(0,5,-95);scene.add(sunDisc);
{const pts=[];for(let i=0;i<300;i++)pts.push(Math.random()*260-60,14+Math.random()*30,-90);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:C.lime,size:.25,fog:false,transparent:true,opacity:.7})));}

// far ridges
function ridge(z,color,base,amp,seed){let r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  const s=new THREE.Shape();s.moveTo(-80,-30);s.lineTo(-80,base);let x=-80;
  while(x<180){x+=4+rnd()*9;s.lineTo(x,base+rnd()*amp);}s.lineTo(180,-30);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color}));m.position.z=z;scene.add(m);}
ridge(-75,0x5a2f52,3,11,3);ridge(-50,0x7a3b32,0,7,11);

// Nubian pyramids in the mid-ground
{const mat=new THREE.MeshLambertMaterial({color:C.mud,flatShading:true});
 for(let i=0;i<9;i++){const cx=-10+i*12+Math.random()*4;
  for(let j=0;j<3;j++){const r=1.4+Math.random()*1.8,h=r*2.4;
   const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,4),mat);m.rotation.y=Math.PI/4;
   m.position.set(cx+j*3.2,-2+h/2,-24-j*4-Math.random()*3);scene.add(m);}}}

// ---------- materials ----------
const sideTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#B5703F';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=16){g.fillStyle='rgba(80,40,20,.25)';g.fillRect(0,y,w,2);}
  for(let i=0;i<220;i++){g.fillStyle=Math.random()<.5?'rgba(60,30,15,.35)':'rgba(246,238,220,.18)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}});
const bandTex=canvasTex(64,32,(g)=>{g.fillStyle='#A8321E';g.fillRect(0,0,64,32);
  g.fillStyle='#F6EEDC';g.strokeStyle='#151211';g.lineWidth=3;
  for(const x of[0,32]){g.beginPath();g.moveTo(x+2,28);g.lineTo(x+16,4);g.lineTo(x+30,28);g.closePath();g.fill();g.stroke();}});
const matSide=new THREE.MeshLambertMaterial({map:sideTex});
const matTop=new THREE.MeshLambertMaterial({color:C.sand});
function scaleUV(geo,sx,sy){const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*sx,uv.getY(i)*sy);uv.needsUpdate=true;}

// ---------- level ----------
const solids=[];
function makeBlockMesh(w,h){const g=new THREE.Group();
  const sg=new THREE.BoxGeometry(w,h,5);scaleUV(sg,w/3,h/3);
  const side=new THREE.Mesh(sg,matSide);side.receiveShadow=true;g.add(side);
  const top=new THREE.Mesh(new THREE.BoxGeometry(w+.12,.2,5.12),matTop);top.position.y=h/2-.08;top.receiveShadow=true;g.add(top);
  const bt=bandTex.clone();bt.needsUpdate=true;bt.repeat.set(Math.max(1,Math.round(w/1.1)),1);
  const band=new THREE.Mesh(new THREE.PlaneGeometry(w,.5),new THREE.MeshLambertMaterial({map:bt}));
  band.position.set(0,h/2-.45,2.52);g.add(band);return g;}
function block(x,y,w,h){const r={x,y,w,h};solids.push(r);const m=makeBlockMesh(w,h);m.position.set(x+w/2,y+h/2,0);scene.add(m);r.mesh=m;return r;}
function wall(x,y,w,h){solids.push({x,y,w,h});}

block(-6,-10,24,10);          // ground 1
block(8,0,3,1.2);             // step
block(18.7,.4,1.6,.4);        // floating stone
block(21,-10,13,10);          // ground 2
block(43,-10,12,12);          // cliff 3 (top 2)
block(63,-10,18,12);          // cliff 4 (top 2)
wall(-8,-10,2,30);wall(81,-10,2,30);

// moving platform
const mp=block(35,.8,2.2,.4);mp.dx=0;

// bell-bridge
const bridge={angle:Math.PI/2,lowering:false,down:false,rect:{x:55,y:1.7,w:8,h:.3}};
{const g=new THREE.Group();const geo=new THREE.BoxGeometry(8,.3,2.6);geo.translate(4,-.15,0);
 const plankTex=canvasTex(64,64,(c)=>{c.fillStyle='#8a5a34';c.fillRect(0,0,64,64);c.fillStyle='#5e3a20';for(let x=0;x<64;x+=16)c.fillRect(x,0,3,64);});
 scaleUV(geo,4,1);
 const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({map:plankTex}));m.castShadow=m.receiveShadow=true;g.add(m);
 g.position.set(55,2,0);g.rotation.z=bridge.angle;scene.add(g);bridge.mesh=g;}
const bell={x:52,rect:{x:51.4,y:2.4,w:1.2,h:1.6},swing:0,rung:false};
{const g=new THREE.Group();const wood=new THREE.MeshLambertMaterial({color:0x5e3a20});
 for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.2,3.2,.2),wood);p.position.set(s*1,1.6,0);p.castShadow=true;g.add(p);}
 const bar=new THREE.Mesh(new THREE.BoxGeometry(2.6,.2,.25),wood);bar.position.y=3.2;g.add(bar);
 const piv=new THREE.Group();piv.position.y=3.1;g.add(piv);
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.25,.55,.9,16,1,true),new THREE.MeshLambertMaterial({color:C.ochre,side:THREE.DoubleSide}));
 b.position.y=-.65;b.castShadow=true;piv.add(b);
 g.position.set(52,2,0);scene.add(g);bell.piv=piv;}

// shrine + dragon egg
const egg={x:77,y:2};
{const g=new THREE.Group();
 const arch=new THREE.Mesh(new THREE.TorusGeometry(1.8,.28,8,24,Math.PI),new THREE.MeshLambertMaterial({color:C.henna}));arch.position.set(0,2,-1.2);g.add(arch);
 for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.BoxGeometry(.56,2,.56),new THREE.MeshLambertMaterial({color:C.henna}));p.position.set(s*1.8,1,-1.2);g.add(p);}
 const ped=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,.5,16),new THREE.MeshLambertMaterial({color:C.lime}));ped.position.y=.25;g.add(ped);
 const e=new THREE.Mesh(new THREE.SphereGeometry(.45,24,16),new THREE.MeshLambertMaterial({color:C.ochre,emissive:0x3a1a00}));e.scale.y=1.3;e.position.y=1.08;g.add(e);
 for(let i=0;i<6;i++){const sp=new THREE.Mesh(new THREE.SphereGeometry(.08,8,6),new THREE.MeshLambertMaterial({color:C.henna}));const a=i*1.05;sp.position.set(Math.cos(a)*.43,1+Math.sin(i*2)*.3,Math.sin(a)*.43);g.add(sp);}
 const l=new THREE.PointLight(0xffb040,1.2,7);l.position.y=1.4;g.add(l);
 g.position.set(egg.x,egg.y,0);scene.add(g);egg.mesh=e;egg.light=l;}

// shards
const shardGeo=new THREE.OctahedronGeometry(.28);
const shardMat=new THREE.MeshLambertMaterial({color:C.turq,emissive:0x0b6a62});
const shards=[[9.5,2.2],[19.5,1.9],[38,2.9]].map(([x,y])=>{const m=new THREE.Mesh(shardGeo,shardMat);m.position.set(x,y,0);m.castShadow=true;scene.add(m);return{x,y,m,got:false};});

// enemies (ظلال)
const enemies=[];
function enemy(a,b,y){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.SphereGeometry(.45,16,12),new THREE.MeshLambertMaterial({color:C.kohl}));body.scale.y=1.25;body.position.y=.6;body.castShadow=true;g.add(body);
  const flame=new THREE.Mesh(new THREE.ConeGeometry(.22,.5,8),new THREE.MeshLambertMaterial({color:0x2a1f3a}));flame.position.y=1.25;g.add(flame);
  const eyeM=new THREE.MeshBasicMaterial({color:0xff6a2a});
  for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),eyeM);e.position.set(s*.15,.78,.4);g.add(e);}
  scene.add(g);enemies.push({a,b,y,x:a,dir:1,w:.8,h:1.2,alive:true,dying:0,g});}
enemy(24,32,0);enemy(45,50,2);enemy(66,74,2);

// ---------- player ----------
const P={x:0,y:0,w:.6,h:1.5,vy:0,kx:0,face:1,ground:null,coyote:0,jumpBuf:0,atk:0,inv:0,hearts:3,shards:0,cp:{x:0,y:0}};
const hero=new THREE.Group();scene.add(hero);
const legs=[];
{const kohlM=new THREE.MeshLambertMaterial({color:0x2a2220});
 for(const z of[-.1,.1]){const piv=new THREE.Group();piv.position.set(0,.6,z);const m=new THREE.Mesh(new THREE.BoxGeometry(.16,.58,.16),kohlM);m.position.y=-.29;m.castShadow=true;piv.add(m);hero.add(piv);legs.push(piv);}
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.24,.32,.78,12),new THREE.MeshLambertMaterial({color:C.indigo}));body.position.y=.98;body.castShadow=true;hero.add(body);
 const sash=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.1,12),new THREE.MeshLambertMaterial({color:C.henna}));sash.position.y=.72;hero.add(sash);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,14,10),new THREE.MeshLambertMaterial({color:0x7a4a2e}));head.position.y=1.5;head.castShadow=true;hero.add(head);
 const wrap=new THREE.Mesh(new THREE.SphereGeometry(.24,14,10),new THREE.MeshLambertMaterial({color:C.lime}));wrap.position.y=1.6;wrap.scale.set(1,.65,1);hero.add(wrap);}
const capePiv=new THREE.Group();capePiv.position.set(-.18,1.32,0);hero.add(capePiv);
{const m=new THREE.Mesh(new THREE.PlaneGeometry(.7,1),new THREE.MeshLambertMaterial({color:C.turq,side:THREE.DoubleSide}));m.rotation.y=Math.PI/2;m.position.y=-.5;m.castShadow=true;capePiv.add(m);}
const armPiv=new THREE.Group();armPiv.position.set(.05,1.22,.32);hero.add(armPiv);
{const blade=new THREE.Mesh(new THREE.BoxGeometry(.07,.95,.05),new THREE.MeshLambertMaterial({color:0xdfe6ea,emissive:0x222222}));blade.position.y=.6;blade.castShadow=true;armPiv.add(blade);
 const hilt=new THREE.Mesh(new THREE.BoxGeometry(.3,.07,.08),new THREE.MeshLambertMaterial({color:C.ochre}));hilt.position.y=.12;armPiv.add(hilt);}
const trail=new THREE.Mesh(new THREE.RingGeometry(.9,1.45,20,1,-1.2,2.4),new THREE.MeshBasicMaterial({color:C.lime,transparent:true,opacity:0,side:THREE.DoubleSide}));
trail.position.set(.1,1.1,.35);hero.add(trail);

// ---------- input ----------
const keys={left:false,right:false};
const map={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyX:'attack',KeyK:'attack'};
function press(k){if(dialog){advance();return;}if(k==='jump')P.jumpBuf=.14;else if(k==='attack'){if(P.atk<=0){P.atk=.28;beep(220,.12,'sawtooth',.04,110);hitCheck();}}else keys[k]=true;}
function release(k){if(k==='left'||k==='right')keys[k]=false;}
addEventListener('keydown',e=>{if(e.code==='Enter'&&dialog){advance();return;}const k=map[e.code];if(!k)return;e.preventDefault();if(!e.repeat)press(k);});
addEventListener('keyup',e=>{const k=map[e.code];if(k)release(k);});
if(matchMedia('(pointer:coarse)').matches)document.getElementById('touch').style.display='block';
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k);});
  for(const ev of['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>release(k));});

// ---------- audio ----------
let ac;
function beep(f,d=.12,type='square',v=.05,slide=0){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}}

// ---------- ui ----------
const $=id=>document.getElementById(id);
function hud(){$('hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<P.hearts?'':'off'}">♥</span>`).join('');$('shards').textContent=`◆ ${P.shards} / 3`;}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2400);}
let dialog=null;
function say(lines,done){dialog={lines,i:0,done};$('dlg').classList.remove('hidden');show();}
function show(){const[who,txt]=dialog.lines[dialog.i];$('dlg').querySelector('.who').textContent=who;$('dlg').querySelector('.txt').textContent=txt;}
function advance(){dialog.i++;if(dialog.i>=dialog.lines.length){const d=dialog.done;dialog=null;$('dlg').classList.add('hidden');d&&d();}else show();}
$('dlg').addEventListener('click',advance);
$('again').addEventListener('click',()=>location.reload());

// ---------- physics ----------
const G=28,SPEED=6,JUMP=10.2;
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function allSolids(){return bridge.down?solids.concat([bridge.rect]):solids;}
function moveX(dx){P.x+=dx;for(const s of allSolids())if(hit(P,s)){if(dx>0)P.x=s.x-P.w;else if(dx<0)P.x=s.x+s.w;}}
function moveY(dy){P.y+=dy;P.ground=null;for(const s of allSolids())if(hit(P,s)){if(dy<0){P.y=s.y+s.h;P.vy=0;P.ground=s;}else if(dy>0){P.y=s.y-P.h;P.vy=0;}}}
function hurt(dir){if(P.inv>0)return;P.hearts--;P.inv=1.3;P.vy=7;P.kx=dir*7;beep(160,.25,'square',.06,60);hud();if(P.hearts<=0)respawn(true);}
function respawn(full){P.x=P.cp.x;P.y=P.cp.y+.1;P.vy=0;P.kx=0;if(full){P.hearts=3;toast('حاول مرة أخرى يا آرين');}hud();}
function attackBox(){return P.face>0?{x:P.x+P.w,y:P.y+.2,w:1.4,h:1.2}:{x:P.x-1.4,y:P.y+.2,w:1.4,h:1.2};}
function hitCheck(){const a=attackBox();
  for(const e of enemies)if(e.alive&&hit(a,{x:e.x-e.w/2,y:e.y,w:e.w,h:e.h})){e.alive=false;e.dying=.4;beep(90,.3,'sawtooth',.06,40);}
  if(!bell.rung&&hit(a,bell.rect)){bell.rung=true;bell.swing=1;bridge.lowering=true;
    [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,1.6,'sine',.07),i*60));toast('الجسر ينزل…');}}
const checkpoints=[{x:0,y:0},{x:22,y:0},{x:44,y:2},{x:64,y:2}];
let bellHint=false,eggHint=false,ended=false,time=0;

function update(dt){
  time+=dt;
  // moving platform
  const nx=35+(Math.sin(time*.8)*.5+.5)*5.6;mp.dx=nx-mp.x;mp.x=nx;mp.mesh.position.x=mp.x+mp.w/2;
  // bridge
  if(bridge.lowering&&!bridge.down){bridge.angle=Math.max(0,bridge.angle-dt*1.1);if(bridge.angle===0){bridge.down=true;beep(70,.3,'triangle',.08);}}
  bridge.mesh.rotation.z=bridge.angle;
  bell.swing*=Math.pow(.25,dt);bell.piv.rotation.z=Math.sin(time*10)*.5*bell.swing;
  if(dialog||ended)return;

  // player
  if(P.ground===mp)moveX(mp.dx);
  const dir=(keys.right?1:0)-(keys.left?1:0);if(dir)P.face=dir;
  P.kx*=Math.pow(.02,dt);
  moveX((dir*SPEED+P.kx)*dt);
  P.coyote=P.ground?.1:P.coyote-dt;P.jumpBuf-=dt;
  if(P.jumpBuf>0&&P.coyote>0){P.vy=JUMP;P.jumpBuf=0;P.coyote=0;beep(330,.12,'square',.035,660);}
  P.vy-=G*dt;if(P.vy<-20)P.vy=-20;
  moveY(P.vy*dt);
  P.atk-=dt;P.inv-=dt;

  // enemies
  for(const e of enemies){
    if(!e.alive){if(e.dying>0){e.dying-=dt;const s=Math.max(.01,e.dying/.4);e.g.scale.set(s,s*1.6,s);}else e.g.visible=false;continue;}
    e.x+=e.dir*1.6*dt;if(e.x>e.b)e.dir=-1;if(e.x<e.a)e.dir=1;
    e.g.position.set(e.x,e.y+Math.sin(time*4+e.a)*.08,0);
    if(hit(P,{x:e.x-e.w/2+.1,y:e.y,w:e.w-.2,h:e.h}))hurt(P.x+P.w/2<e.x?-1:1);}

  // shards
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  for(const s of shards){if(s.got)continue;s.m.rotation.y+=dt*2;s.m.position.y=s.y+Math.sin(time*3+s.x)*.12;
    if(Math.hypot(pcx-s.x,pcy-s.y)<.9){s.got=true;s.m.visible=false;P.shards++;hud();[880,1175].forEach((f,i)=>setTimeout(()=>beep(f,.15,'square',.04),i*80));toast(`شظية الحارس ${P.shards} / 3`);}}

  // checkpoints
  for(const c of checkpoints)if(P.x>=c.x&&c.x>P.cp.x){P.cp=c;if(c.x>0)toast('نقطة حفظ');}

  // hints & goal
  if(!bellHint&&Math.abs(pcx-bell.x)<3.5&&!bell.rung){bellHint=true;toast('اضرب الجرس لإنزال الجسر');}
  if(Math.abs(pcx-egg.x)<1.3){
    if(P.shards>=3){ended=true;beep(523,.6,'sine',.07);setTimeout(()=>beep(784,.9,'sine',.07),200);
      say([['آرين','البيضة… دافئة. كأن شيئًا في داخلها يسمع اسمي.'],['صوت الحارس','أحسنت يا سليل الحارس. هذه أول خطوة في طريق المئتي فصل.']],()=>{$('end').style.display='flex';});}
    else if(!eggHint){eggHint=true;toast('تحتاج 3 شظايا لفتح المزار');}}
  else eggHint=false;

  if(P.y<-7){hurt(0);if(P.hearts>0)respawn(false);}
}

// ---------- render ----------
const camPos=new THREE.Vector3(0,3,17);
function draw(dt){
  const pcx=P.x+P.w/2;
  hero.position.set(pcx,P.y,0);hero.scale.x=P.face;
  hero.visible=!(P.inv>0&&Math.floor(time*20)%2===0);
  const run=Math.abs((keys.right?1:0)-(keys.left?1:0));
  const sw=P.ground?Math.sin(time*13)*.7*run:.35;
  legs[0].rotation.z=sw;legs[1].rotation.z=-sw;
  capePiv.rotation.z=-(.15+run*.6+(P.ground?0:.4)+Math.sin(time*9)*.08);
  if(P.atk>0){const a=1-P.atk/.28;armPiv.rotation.z=1.3-a*3.5;trail.material.opacity=.6*(1-a);}
  else{armPiv.rotation.z=2.5;trail.material.opacity=0;}
  egg.mesh.rotation.z=Math.sin(time*5)*.05*(P.shards>=3?2:.4);egg.light.intensity=1+Math.sin(time*3)*.3;

  const tx=pcx+P.face*2,ty=Math.max(P.y+2.4,2.2);
  camPos.x+=(tx-camPos.x)*Math.min(1,dt*3);camPos.y+=(ty-camPos.y)*Math.min(1,dt*3);camPos.z=camDist;
  camera.position.copy(camPos);camera.lookAt(camPos.x,camPos.y-1.2,0);
  sunDisc.position.x=camPos.x*.95;
  sun.position.set(camPos.x+8,16,10);sun.target.position.set(camPos.x,0,0);
  renderer.render(scene,camera);
}

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw(dt);requestAnimationFrame(loop);}
hud();requestAnimationFrame(loop);
say([
  ['آرين','الريح تحمل صوت الجرس القديم… هنا نادى الحارس العظيم آخر مرة.'],
  ['صوت الحارس','يا سليل الحارس، اجمع شظايا القَسَم الثلاث، واعبر الهاوية إلى بيضة التنين.'],
  ['التحكم',matchMedia('(pointer:coarse)').matches?'◀ ▶ للحركة، «قفز» للقفز، «ضرب» للسيف.':'← → أو A D للحركة · مسافة أو W للقفز · J للضرب بالسيف.']
]);
</script>
