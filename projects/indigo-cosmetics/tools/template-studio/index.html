/* Layout: three panes — template gallery (start side), live stage (centre), editor (end side); stacks on phones. */
:root{

.thumb{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:start;color:var(--ink);font-family:var(--ui);content-visibility:auto;contain-intrinsic-size:150px 220px}

.icongrid button svg{width:24px;height:24px}
.selbox{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.selbox .row{display:flex;gap:8px;flex-wrap:wrap}

details.lib .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.libgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.libgrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;cursor:grab;display:flex;align-items:center;justify-content:center;padding:0;min-height:44px}
.libgrid button svg{width:26px;height:26px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:10px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
#exportHost{position:absolute;left:-14000px;top:0}
@media (max-width:1100px){
  .app{height:auto}

  .gallery{order:3;border:0;border-top:1px solid var(--line);max-height:80vh}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="app" dir="rtl" lang="ar">

for (let v = 0; v < 50; v++) for (let L = 0; L < LAYOUTS.length; L++) {
  // spread palette, font pairing and decoration so no two variants of one layout share all three
  const lay = LAYOUTS[L], p = (v + L * 7) % PAL.length, f = (v * 2 + Math.floor(v / 20) * 7 + L) % FP.length, d = (v + Math.floor(v / 10) + L) % 4;
  TPLS.push({ id: TPLS.length, num: TPLS.length + 1, L, p, f, d, name: `${lay.name} · ${PAL[p].n}` });
}

// ---------- state ----------
const KEY = 'template-studio-v1';
let edits = {}; let sel = 0; let fmt = 'post'; let cat = -1; let query = '';

function save(){
  const data = { edits, sel, fmt };
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch (e) { // images too large for browser storage: keep the rest
    try { const lite = JSON.parse(JSON.stringify(data)); Object.values(lite.edits).forEach(x => Object.keys(x).forEach(k => /^img\d*$/.test(k) && delete x[k])); localStorage.setItem(KEY, JSON.stringify(lite)); } catch (e2) {}
  }
}
const E = id => (edits[id] ||= {});

function ctx(tpl, f = fmt){
  const e = edits[tpl.id] || {}, lay = LAYOUTS[tpl.L], fp = FP[tpl.f];
  const texts = { ...lay.text, ...(e.texts || {}) };
  const fonts = { head: e.head || fp.head, body: e.body || fp.body, latin: e.latin || fp.latin };
  const hw = e.head && e.head !== fp.head ? 700 : fp.hw;
  return { c: { ...PAL[tpl.p].c, ...(e.colors || {}) }, f: fonts, hw, t: k => nl(texts[k]), im: i => (i === 0 ? e.img : e['img' + (i + 1)]) || '', H: FMT[f].h, d: e.deco ?? tpl.d };
}
const html = (tpl, f) => { CUR = ctx(tpl, f); return LAYOUTS[tpl.L].render(CUR); };

const iconColor = (ic, x) => ({ accent:x.c.accent, accent2:x.c.accent2, text:x.c.text, white:'#FFFFFF' })[ic.color] || x.c.accent;
const iconSvg = (name, col, fill, w = '100%') => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${fill ? col : 'none'}" stroke="${col}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_SET[name] || ''}</svg>`;
const libSvg = (o, col, w = '100%') => `<svg width="${w}" height="${w}" viewBox="${o.vb}" ${o.t === 's' ? `fill="none" stroke="${col}" stroke-width="${o.sw || 2}" stroke-linecap="round" stroke-linejoin="round"` : `fill="${col}"`} aria-hidden="true">${String(o.svg).replace(/%C%/g, col)}</svg>`;
function iconHTML(ic, x){ const col = iconColor(ic, x);
  return `<div data-icon="${ic.id}" style="position:absolute;left:${ic.x}px;top:${ic.y}px;width:${ic.size}px;height:${ic.size}px">${ic.svg ? libSvg(ic, col) : iconSvg(ic.name, col, ic.fill)}</div>`; }
const posT = p => `translate(${p.dx || 0}px, ${p.dy || 0}px) scale(${p.s || 1})`;
function movable(n){
  if (n.closest('[data-img]') && !n.dataset.img) return false;
  if (n.dataset.img) return true;
  if ([...n.childNodes].some(c => c.nodeType === 3 && c.textContent.trim())) return true;
  return n.children.length === 1 && n.firstElementChild.tagName.toLowerCase() === 'svg';
}
function mount(box, tpl, f, interactive){
  box.innerHTML = html(tpl, f); const x = CUR;
  const r = box.firstElementChild, e = edits[tpl.id] || {}, pos = e.pos || {};
  const els = [...r.querySelectorAll('*')].filter(n => n.tagName !== 'BR' && !n.closest('svg'));
  els.forEach((n, i) => {
    const k = 'n' + i;
    if (pos[k]) n.style.transform = posT(pos[k]);
    if (interactive && movable(n)) n.dataset.dk = k;
  });
  if (e.icons && e.icons.length) r.insertAdjacentHTML('beforeend', e.icons.map(ic => iconHTML(ic, x)).join(''));
}

// ---------- fonts on demand ----------
const loaded = new Set([...FP.flatMap(x => [x.head, x.body, x.latin]), 'Readex Pro']);
function ensureFont(name){
  if (!name || loaded.has(name)) return; loaded.add(name);
  const q = name.replace(/ /g, '+'); const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = `https://fonts.googleapis.com/css2?family=${q}:wght@400;700&display=swap`;
  l.onerror = () => { l.href = `https://fonts.googleapis.com/css2?family=${q}&display=swap`; l.onerror = null; };
  document.head.appendChild(l);
  document.fonts.load(`40px '${name}'`).then(() => { renderStage(); refreshThumb(sel); }).catch(() => {});
}

// ---------- gallery ----------
const $ = id => document.getElementById(id);
const grid = $('grid');
function buildCats(){
  const box = $('cats'); box.innerHTML = '';
  [['الكل', -1], ...LAYOUTS.map((l, i) => [l.name, i])].forEach(([n, i]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = n; b.setAttribute('aria-pressed', String(i === cat));
    b.addEventListener('click', () => { cat = i; buildCats(); buildGallery(); }); box.appendChild(b);
  });
}
const THUMB_W = 132;
function thumbInto(tv, tpl){ const s = THUMB_W / 1080; tv.innerHTML = `<div class="inner" style="width:1080px;height:${FMT[fmt].h}px;transform:scale(var(--k, ${s}))"></div>`; mount(tv.firstElementChild, tpl, fmt, false); }
function buildGallery(){
  const q = query.trim();
  const list = TPLS.filter(t => (cat < 0 || t.L === cat) && (!q || String(t.num) === q || t.name.includes(q)));
  $('count').textContent = `${list.length} قالب`;
  grid.innerHTML = ''; curList = list; shown = 0; moreThumbs();
}
let curList = [], shown = 0;
function moreThumbs(){
  const frag = document.createDocumentFragment();
  curList.slice(shown, shown + 60).forEach(t => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'thumb'; b.dataset.id = t.id;
    b.setAttribute('aria-label', `قالب ${t.num}: ${t.name}`); b.setAttribute('aria-current', String(t.id === sel));
    b.innerHTML = `<div class="tv" style="aspect-ratio:1080/${FMT[fmt].h}"></div><span class="meta"><b>${t.num}</b><span>${esc(t.name)}</span></span>`; thumbInto(b.firstElementChild, t);
    b.addEventListener('click', () => select(t.id)); frag.appendChild(b);
  });
  shown = Math.min(curList.length, shown + 60); grid.appendChild(frag); fitThumbs();
}
const sentinel = document.createElement('div'); sentinel.style.height = '1px'; grid.after(sentinel);
new IntersectionObserver(en => { if (en.some(x => x.isIntersecting) && shown < curList.length) moreThumbs(); }, { rootMargin: '600px' }).observe(sentinel);
function fitThumbs(){
  const first = grid.querySelector('.tv'); if (!first) return;
  grid.style.setProperty('--k', String(first.clientWidth / 1080));
}
function refreshThumb(id){
  const b = grid.querySelector(`.thumb[data-id="${id}"] .tv`); if (b) thumbInto(b, TPLS[id]);
}
new ResizeObserver(fitThumbs).observe(grid);

// ---------- stage ----------
function renderStage(){
  const tpl = TPLS[sel]; mount($('frameInner'), tpl, fmt, true); markPicked();
  $('curName').textContent = `${tpl.num} · ${tpl.name}`; $('curSize').textContent = FMT[fmt].label; fitStage();
}
function fitStage(){
  const st = $('stage'), H = FMT[fmt].h; const cs = getComputedStyle(st);
  const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const k = Math.max(0.1, Math.min(aw / 1080, (ah > 120 ? ah : 9999) / H, 1));
  const fr = $('frame'); fr.style.width = `${1080 * k}px`; fr.style.height = `${H * k}px`;
  const inn = $('frameInner'); inn.style.width = '1080px'; inn.style.height = `${H}px`; inn.style.transform = `scale(${k})`; STAGE_K = k;
}
new ResizeObserver(fitStage).observe($('stage'));

// ---------- editor ----------
let tick = 0;
function changed(){ renderStage(); clearTimeout(tick); tick = setTimeout(() => { refreshThumb(sel); save(); }, 250); }
function el(tag, props = {}, ...kids){ const n = document.createElement(tag); Object.assign(n, props); kids.forEach(k => n.append(k)); return n; }
function section(title){ const s = el('div', { className: 'sec' }); s.append(el('h2', { textContent: title })); return s; }
function select(id){
  sel = id; picked = null; grid.querySelectorAll('.thumb').forEach(b => b.setAttribute('aria-current', String(+b.dataset.id === id)));
  renderStage(); buildEditor(); save();
}
function buildEditor(){
  const tpl = TPLS[sel], lay = LAYOUTS[tpl.L], e = edits[tpl.id] || {}, fp = FP[tpl.f], x = ctx(tpl);
  const ed = $('editor'); ed.innerHTML = '';

  const sT = section('النصوص');
  lay.fields.forEach(([k, label, type]) => {
    const id = `f-${k}`; const val = (e.texts && k in e.texts) ? e.texts[k] : lay.text[k];
    const inp = type === 'area' ? el('textarea', { id, value: val }) : el('input', { id, type: 'text', value: val });
    inp.addEventListener('input', () => { (E(tpl.id).texts ||= {})[k] = inp.value; changed(); });
    sT.append(el('div', { className: 'field' }, el('label', { htmlFor: id, textContent: label }), inp));
  });
  ed.append(sT);

  const sI = section(lay.slots > 1 ? 'الصور' : 'الصورة');
  for (let i = 0; i < (lay.slots || 1); i++) {
    const key = i === 0 ? 'img' : 'img' + (i + 1);
    const pv = el('div', { className: 'pv' }); if (x.im(i)) pv.style.backgroundImage = `url('${x.im(i)}')`;
    const file = el('input', { type: 'file', accept: 'image/*', id: 'f-' + key });
    file.addEventListener('change', () => {
      const fl = file.files && file.files[0]; if (!fl) return;
      const r = new FileReader(); r.onload = () => { E(tpl.id)[key] = r.result; pv.style.backgroundImage = `url('${r.result}')`; changed(); }; r.readAsDataURL(fl);
    });
    const reset = el('button', { type: 'button', className: 'linkbtn', textContent: 'إزالة' });
    reset.addEventListener('click', () => { delete E(tpl.id)[key]; pv.style.backgroundImage = ''; changed(); });
    sI.append(el('div', { className: 'imgrow' }, pv, el('label', { className: 'file' }, lay.slots > 1 ? `رفع الصورة ${i + 1}` : 'رفع صورة', file), reset));
  }
  sI.append(el('p', { className: 'note', textContent: 'الصورة تملأ مكانها في القالب وتُقصّ من الأطراف عند الحاجة. بدون صورة يظهر مكان فارغ ملوّن.' }));
  ed.append(sI);

    b.addEventListener('click', () => { E(tpl.id).colors = { ...p.c }; changed(); buildEditor(); }); pals.append(b);
  });
  sC.append(pals);
  const names = { bg:'الخلفية', surface:'البطاقات', text:'النص', muted:'النص الثانوي', accent:'اللون الأساسي', accent2:'اللون الثاني' };
  const cg = el('div', { className: 'colors' });

  const selBox = el('div', { id: 'selBox' }); sM.append(selBox);

  Object.keys(ICON_SET).forEach(name => {
    const b = el('button', { type: 'button', draggable: true, title: ICON_NAMES[name] }); b.setAttribute('aria-label', `إضافة أيقونة ${ICON_NAMES[name]}`);

const ICON_QUICK = [['نجمة','star'],['قلب','heart'],['ورقة','leaf'],['قطرة','drop'],['شمس','sun'],['هدية','gift'],['توصيل','truck'],['رسالة','message'],['خصم','discount'],['تاج','crown'],['لمعة','sparkle'],['هاتف','phone']];
function loadLibrary(){

function buildLibrary(){

// ---------- dragging on the stage ----------
let STAGE_K = 1, picked = null, drag = null;
const inner = () => $('frameInner');
function markPicked(){
  inner().querySelectorAll('.picked').forEach(n => n.classList.remove('picked'));
  if (!picked) return;
  const n = picked.startsWith('i:') ? inner().querySelector(`[data-icon="${picked.slice(2)}"]`) : inner().querySelector(`[data-dk="${picked}"]`);
  if (n) n.classList.add('picked'); else picked = null;
}
function getIcon(id){ return (E(TPLS[sel].id).icons || []).find(i => i.id === id); }
function commit(){ clearTimeout(tick); tick = setTimeout(() => { refreshThumb(sel); save(); }, 250); }
function addIcon(spec, cx, cy){
  const e = E(TPLS[sel].id); e.icons ||= [];
  const base = typeof spec === 'string' ? { name: spec } : { name: spec.n, svg: spec.b, t: spec.t, sw: spec.sw, vb: spec.vb };
  const ic = { id: Math.random().toString(36).slice(2, 9), ...base, size: 120, x: Math.round(cx - 60), y: Math.round(cy - 60), color: 'accent', fill: false };
  e.icons.push(ic); picked = 'i:' + ic.id; renderStage(); buildSel(); commit();
}
inner().addEventListener('pointerdown', ev => {
  const t = ev.target.closest('[data-icon],[data-dk]');
  if (!t || !inner().contains(t)) { picked = null; markPicked(); buildSel(); return; }
  ev.preventDefault();
  const e = E(TPLS[sel].id);
  if (t.dataset.icon) { const ic = getIcon(t.dataset.icon); if (!ic) return; picked = 'i:' + ic.id; drag = { t, ic, x0: ic.x, y0: ic.y, sx: ev.clientX, sy: ev.clientY }; }
  else { const k = t.dataset.dk; e.pos ||= {}; const p = e.pos[k] || { dx: 0, dy: 0, s: 1 }; picked = k; drag = { t, k, p: { ...p }, sx: ev.clientX, sy: ev.clientY }; }
  t.setPointerCapture(ev.pointerId); markPicked(); buildSel();
});
inner().addEventListener('pointermove', ev => {
  if (!drag) return;
  const dx = (ev.clientX - drag.sx) / STAGE_K, dy = (ev.clientY - drag.sy) / STAGE_K;
  if (drag.ic) { drag.ic.x = Math.round(drag.x0 + dx); drag.ic.y = Math.round(drag.y0 + dy); drag.t.style.left = drag.ic.x + 'px'; drag.t.style.top = drag.ic.y + 'px'; }
  else { const p = { ...drag.p, dx: Math.round(drag.p.dx + dx), dy: Math.round(drag.p.dy + dy) }; E(TPLS[sel].id).pos[drag.k] = p; drag.t.style.transform = posT(p); }
});
const slotFile = document.createElement('input'); slotFile.type = 'file'; slotFile.accept = 'image/*'; slotFile.hidden = true; document.body.appendChild(slotFile);
let slotKey = 'img';
function pickImage(n){
  const all = [...inner().querySelectorAll('[data-img]')]; const i = Math.max(0, all.indexOf(n));
  slotKey = i === 0 ? 'img' : 'img' + (i + 1); slotFile.value = ''; slotFile.click();
}
slotFile.addEventListener('change', () => {

  const r = new FileReader(); r.onload = () => { E(TPLS[sel].id)[slotKey] = r.result; changed(); buildEditor(); }; r.readAsDataURL(fl);

inner().addEventListener('dblclick', ev => { const n = ev.target.closest('[data-img]'); if (n) pickImage(n); });
const endDrag = ev => {

  const t = drag.t; drag = null; commit();

inner().addEventListener('pointerup', endDrag); inner().addEventListener('pointercancel', endDrag);
const stageEl = $('stage');
stageEl.addEventListener('dragover', ev => { if ([...ev.dataTransfer.types].includes('text/plain')) { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; } });
stageEl.addEventListener('drop', ev => {
  const d = ev.dataTransfer.getData('text/plain'); const lib = d.startsWith('lib:') ? LIB.all[+d.slice(4)] : null;
  if (!d.startsWith('icon:') && !lib) return; ev.preventDefault();
  const r = $('frame').getBoundingClientRect();
  addIcon(lib || d.slice(5), Math.max(0, Math.min(1080, (ev.clientX - r.left) / STAGE_K)), Math.max(0, Math.min(FMT[fmt].h, (ev.clientY - r.top) / STAGE_K)));

$('frame').tabIndex = 0; $('frame').setAttribute('aria-label', 'معاينة القالب: اختاري عنصرًا ثم حرّكيه بالأسهم');
$('frame').addEventListener('keydown', ev => {
  if (!picked) return; const step = ev.shiftKey ? 20 : 4;
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[ev.key];

// ---------- export ----------
let toastT = 0;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const dlP = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
let busy = false;
async function exportPNG(){
  if (busy) return;
  const dl = await dlP;
  if (typeof html2canvas !== 'function') { toast('تعذّر تحميل أداة التصدير. أعيدي تحميل الصفحة.'); return; }
  busy = true; document.querySelectorAll('.btn.primary').forEach(b => b.disabled = true);
  try {
    const tpl = TPLS[sel], H = FMT[fmt].h; const host = $('exportHost'); mount(host, tpl, fmt, false);
    await document.fonts.ready;
    const imgs = [...host.querySelectorAll('[style*="background-image"]')];
    await Promise.all(imgs.map(n => new Promise(res => { const m = /url\('([^']+)'\)/.exec(n.style.backgroundImage.replace(/"/g, "'")); if (!m) return res(); const im = new Image(); im.onload = im.onerror = res; im.src = m[1]; })));
    const canvas = await html2canvas(host.firstElementChild, { scale: 1, width: 1080, height: H, backgroundColor: null, logging: false, useCORS: true });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    host.innerHTML = '';
    const name = `template-${tpl.num}-${fmt}.png`;
    if (dl) await dl.save({ filename: name, data: blob });
    else { // standalone file opened in a normal browser
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }

  } catch (err) {

  } finally { busy = false; document.querySelectorAll('.btn.primary').forEach(b => b.disabled = false); }
}
$('exportBtn').addEventListener('click', exportPNG);
