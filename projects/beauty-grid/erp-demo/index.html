<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beauty-Grid ERP demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a working back office, calm and exact
   IDEA: a production ledger — every stock change is a dated line
   PICTURE: the live tool itself, opened mid-use with sample data
   COLOUR and TYPE: aluminium ground, black ink, orange pointer; Geist + IBM Plex Sans Arabic
   LAYOUT: side rail of modules, work surface beside it; rail becomes a scroll row on phones */
:root{color-scheme:light dark;--bg:light-dark(#e9eaec,#141517);--card:light-dark(#fff,#1d1f22);--ink:light-dark(#111,#eceef0);--mute:light-dark(#62666d,#9aa0a6);--line:light-dark(#d6d8dc,#2c2f33);--acc:#ff4f00;--ok:light-dark(#1d7a46,#4cc38a);--bad:light-dark(#b42318,#ff7b6e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Geist,"IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",Geist,system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{background:#111;color:#eee;padding:20px 12px;display:flex;flex-direction:column;gap:2px}
nav b{font-size:18px;padding:0 10px 4px;font-family:Geist,sans-serif}nav small{color:#999;padding:0 10px 16px}
nav a{color:#ccc;text-decoration:none;padding:10px;border-radius:8px;min-height:44px;display:flex;align-items:center}
nav a.on{background:#2a2a2a;color:#fff;box-shadow:inset 3px 0 var(--acc)}[dir=rtl] nav a.on{box-shadow:inset -3px 0 var(--acc)}
nav button{background:none;color:#ccc;border:1px solid #333}nav .push{margin-top:auto}
main{padding:clamp(16px,3vw,36px);max-width:1180px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 6px;font-weight:600;text-wrap:balance}
h2{font-size:20px;margin:0 0 12px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border-radius:12px;padding:18px;border:1px solid var(--line);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{font-size:clamp(24px,2.6vw,32px);font-weight:600;white-space:nowrap}.kpi+div{color:var(--mute);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:start;color:var(--mute);font-weight:500;font-size:13px;border-bottom:1px solid var(--line);padding:8px 6px}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
input,select,button{font:inherit;font-size:16px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px}
button{cursor:pointer;background:var(--ink);color:var(--bg);border:0;font-weight:500}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.acc{background:var(--acc);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.row label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:currentColor}.tag.bad{color:var(--bad);border-color:currentColor}.tag.draft{color:var(--mute)}
#toast{position:fixed;bottom:20px;inset-inline-end:20px;background:#111;color:#fff;padding:12px 16px;border-radius:10px;max-width:360px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
.pos{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tiles button{min-height:86px;background:var(--bg);color:var(--ink);border:1px solid var(--line);text-align:start;display:flex;flex-direction:column;justify-content:space-between}
.tiles small{color:var(--mute)}
.big{font-size:32px;font-weight:600}
.scroll{overflow-x:auto}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
@media(max-width:760px){.app{grid-template-columns:1fr;align-content:start}nav{flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;position:sticky;top:0;z-index:2}nav b{flex:none;white-space:nowrap;padding:0 8px;font-size:16px}nav a,nav button{flex:none}nav small{display:none}nav .push{margin:0}.pos{grid-template-columns:1fr}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}.stack td:empty{display:none}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>

class StockError extends Error{}
/* every stock change goes through move() */
function move(items,ref,from,to){
 for(const [id,q] of items){const p=P(id);if(p.type!=='storable')continue;
  if(from==='Stock'&&qty(id)<q)throw new StockError(T[L].notEnough(L==='ar'&&p.ar?p.ar:p.name,fmt(qty(id)),fmt(q),U(p)))}
 for(const [id,q] of items){const p=P(id);if(p.type!=='storable'||!q)continue;
  if(from==='Stock')S.stock[id]=qty(id)-q;if(to==='Stock')S.stock[id]=qty(id)+q;
  S.moves.unshift({date:new Date().toISOString(),ref,product:id,qty:q,from,to})}
}

 <div class="card"><div class="kpi">${low.length}</div><div>${t('k4')}</div></div></div>
 <div class="grid"><div class="card"><h2>${t('low')}</h2>${low.length?`<table><tbody>${low.map(p=>`<tr><td>${nm(p)}</td><td class="n">${fmt(qty(p.id))} ${U(p)}</td></tr>`).join('')}</tbody></table>`:`<p class="sub">${t('nothingLow')}</p>`}</div>
 <div class="card"><h2>${t('waiting')}</h2>${wait.length?`<table><tbody>${wait.map(m=>`<tr><td>${m.id} · ${nm(P(bomOf(m.bom).product))} × ${fmt(m.qty)}</td><td class="n">${tag(missing(m).length?'missing':'ready')}</td></tr>`).join('')}</tbody></table>`:`<p class="sub">${t('noOpen')}</p>`}<p><a href="#manufacturing">${t('openMfg')}</a></p></div></div>`},
products(){return `<h1>${t('products')}</h1><p class="sub">${t('prodS')}</p>
 <div class="card"><h2>${t('newProduct')}</h2><form id="fprod" class="row"><label>${t('name')}<input name="name" required></label><label>${t('type')}<select name="type">${['storable','consumable','service'].map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select></label><label>${t('uom')}<select name="uom">${['unit','g','kg','ml','L'].map(u=>`<option value="${u}">${t(u)}</option>`).join('')}</select></label><label>${t('salePrice')}<input name="price" type="number" min="0" step="any" value="0" style="width:120px"></label><label>${t('cost')}<input name="cost" type="number" min="0" step="any" value="0" style="width:120px"></label><button>${t('add')}</button></form></div>
 <div class="card"><input id="q" placeholder="${t('search')}" aria-label="${t('search')}" style="width:100%;margin-bottom:8px"><table class="stack"><thead><tr><th>${t('product')}</th><th>${t('type')}</th><th class="n">${t('onHand')}</th><th class="n">${t('salePrice')}</th><th class="n">${t('cost')}</th></tr></thead><tbody id="plist"></tbody></table></div>`},
partners(){return `<h1>${t('partT')}</h1><p class="sub">${t('partS')}</p>
 <div class="card"><h2>${t('newContact')}</h2><form id="fpart" class="row"><label>${t('name')}<input name="name" required></label><label>${t('phone')}<input name="phone" dir="ltr"></label><label><span><input type="checkbox" name="customer" checked style="min-height:auto"> ${t('customer')}</span></label><label><span><input type="checkbox" name="vendor" style="min-height:auto"> ${t('vendor')}</span></label><button>${t('add')}</button></form></div>
 <div class="card"><table class="stack"><thead><tr><th>${t('name')}</th><th>${t('phone')}</th><th>${t('role')}</th></tr></thead><tbody>${S.partners.map(p=>`<tr><td>${nm(p)}</td><td dir="ltr">${esc(p.phone||'')}</td><td>${[p.customer&&t('customer'),p.vendor&&t('vendor')].filter(Boolean).join('، ')}</td></tr>`).join('')}</tbody></table></div>`},
recipes(){return `<h1>${t('recipes')}</h1><p class="sub">${t('recS')}</p>
 ${S.boms.map(b=>`<div class="card"><h2>${nm(P(b.product))} · ${t('batchOf')} ${fmt(b.qty)}</h2><table><thead><tr><th>${t('component')}</th><th class="n">${t('quantity')}</th><th class="n">${t('inStock')}</th></tr></thead><tbody>${b.lines.map(([c,q])=>`<tr><td>${nm(P(c))}</td><td class="n">${fmt(q)} ${U(P(c))}</td><td class="n">${fmt(qty(c))} ${U(P(c))}</td></tr>`).join('')}</tbody></table></div>`).join('')}
 <div class="card"><h2>${t('newRecipe')}</h2><form id="fbom"><div class="row"><label>${t('product')}<select name="product">${opts(S.products.filter(p=>p.type==='storable'))}</select></label><label>${t('batchSize')}<input name="qty" type="number" min="1" step="any" value="10" style="width:110px"></label></div><p class="sub" style="margin:10px 0 0">${t('components')}</p><div id="bomlines"></div><button type="button" class="ghost" data-addline="bomlines" data-price="0">${t('addLine')}</button> <button>${t('saveRecipe')}</button></form></div>`},
manufacturing(){return `<h1>${t('manufacturing')}</h1><p class="sub">${t('mfgS')}</p>
 <div class="card"><h2>${t('newMO')}</h2><form id="fmo" class="row"><label>${t('recipe')}<select name="bom">${S.boms.map(b=>`<option value="${b.id}">${nm(P(b.product))} (${t('batch')} ${fmt(b.qty)})</option>`).join('')}</select></label><label>${t('qtyToMake')}<input name="qty" type="number" min="1" step="any" value="10" style="width:130px"></label><button>${t('create')}</button></form></div>
 <div class="card"><table class="stack"><thead><tr><th>${t('order')}</th><th>${t('product')}</th><th class="n">${t('quantity')}</th><th>${t('components')}</th><th></th></tr></thead><tbody>${S.mos.map(m=>`<tr><td>${m.id}</td><td>${nm(P(bomOf(m.bom).product))}</td><td class="n">${fmt(m.qty)}</td><td>${m.state==='done'?tag('done'):missing(m).length?tag('missing')+' '+missText(m):tag('ready')}</td><td class="n">${m.state==='draft'?`<button class="acc" data-produce="${m.id}">${t('produce')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`},
purchases(){return orderView(t('purT'),t('purS'),S.pos,'buy','fpo')},
sales(){return orderView(t('saleT'),t('saleS'),S.sos,'sell','fso')},
counts(){return `<h1>${t('counts')}</h1><p class="sub">${t('cntS')}</p>
 <div class="card"><form id="fcnt"><div id="cntlines"></div><button type="button" class="ghost" id="cntadd">${t('addProduct')}</button> <button>${t('applyCount')}</button></form></div>
 <div class="card"><h2>${t('pastCounts')}</h2>${S.counts.length?`<table><thead><tr><th>${t('count')}</th><th>${t('date')}</th><th class="n">${t('lines')}</th></tr></thead><tbody>${S.counts.map(c=>`<tr><td>${c.id}</td><td>${dt(c.date)}</td><td class="n">${c.lines}</td></tr>`).join('')}</tbody></table>`:`<p class="sub">${t('noCounts')}</p>`}</div>`},
pos(){const s=S.session;
 if(!s)return `<h1>${t('pos')}</h1><p class="sub">${t('posS')}</p><div class="card"><form id="fopen" class="row"><label>${t('openingCash')} (${t('cur')})<input name="cash" type="number" min="0" step="any" value="20000"></label><button class="acc">${t('openSession')}</button></form></div>
  ${S.sessions.length?`<div class="card"><h2>${t('closedSessions')}</h2><table class="stack"><thead><tr><th>${t('session')}</th><th class="n">${t('opening')}</th><th class="n">${t('expected')}</th><th class="n">${t('countedCash')}</th><th class="n">${t('difference')}</th></tr></thead><tbody>${S.sessions.map(x=>`<tr><td>#${x.id}</td><td class="n">${fmt(x.open)}</td><td class="n">${fmt(x.expected)}</td><td class="n">${fmt(x.counted)}</td><td class="n">${fmt(x.counted-x.expected)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
 const lines=Object.entries(s.cart||{}).map(([id,q])=>[+id,q,P(id).price]);
 return `<h1>${t('pos')}</h1><p class="sub">${t('session')} #${s.id} · ${t('openedWith')} ${money(s.open)} · ${t('cashSales')} ${money(s.cashSales)}</p>
 <div class="pos"><div class="card tiles">${S.products.filter(p=>p.price>0).map(p=>`<button data-sell="${p.id}"><span>${nm(p)}</span><small>${money(p.price)}${p.type==='storable'?` · ${fmt(qty(p.id))} ${t('left')}`:''}</small></button>`).join('')}</div>
 <div class="card"><h2>${t('currentSale')}</h2>${lines.length?`<table><tbody>${lines.map(([id,q,pr])=>`<tr><td>${nm(P(id))}</td><td class="n">${q} × ${fmt(pr)}</td><td class="n"><button class="ghost" data-less="${id}" aria-label="${t('removeOne')}">−</button></td></tr>`).join('')}</tbody></table>`:`<p class="sub">${t('tapProduct')}</p>`}
 <div class="big">${money(total(lines))}</div>
 <div class="row" style="margin:10px 0"><select id="method" aria-label="${t('method')}"><option value="cash">${t('cash')}</option><option value="bank">${t('bank')}</option></select><button class="acc" id="pay" ${lines.length?'':'disabled'}>${t('pay')}</button></div>
 <form id="fclose" class="row" style="border-top:1px solid var(--line);padding-top:12px"><label>${t('countedClose')}<input name="cash" type="number" min="0" step="any" required style="width:150px"></label><button class="ghost">${t('closeSession')}</button></form></div></div>`},
moves(){return `<h1>${t('moves')}</h1><p class="sub">${t('movesS')}</p><div class="card scroll">${S.moves.length?`<table class="stack"><thead><tr><th>${t('date')}</th><th>${t('reference')}</th><th>${t('product')}</th><th class="n">${t('quantity')}</th><th>${t('fromTo')}</th></tr></thead><tbody>${S.moves.slice(0,200).map(m=>`<tr><td>${dt(m.date)}</td><td>${m.ref}</td><td>${nm(P(m.product))}</td><td class="n">${fmt(m.qty)} ${U(P(m.product))}</td><td>${t(m.from)} ${L==='ar'?'←':'→'} ${t(m.to)}</td></tr>`).join('')}</tbody></table>`:`<p class="sub">${t('noMoves')}</p>`}</div>`}
};
function orderView(title,sub,list,kind,fid){const who=S.partners.filter(p=>kind==='buy'?p.vendor:p.customer),role=t(kind==='buy'?'vendor':'customer');
 return `<h1>${title}</h1><p class="sub">${sub}</p>
 <div class="card"><h2>${t('newOrder')}</h2><form id="${fid}"><div class="row"><label>${role}<select name="partner">${opts(who)}</select></label></div><div id="${fid}-lines" data-kind="${kind}"></div><button type="button" class="ghost" data-addline="${fid}-lines" data-price="1">${t('addLine')}</button> <button>${t('createOrder')}</button></form></div>
 <div class="card"><table class="stack"><thead><tr><th>${t('order')}</th><th>${role}</th><th>${t('lines')}</th><th class="n">${t('total')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td>${o.id}</td><td>${nm(partner(o.partner))}</td><td>${o.lines.map(([id,q])=>`${nm(P(id))} × ${fmt(q)}`).join('، ')}</td><td class="n">${money(total(o.lines))}</td><td>${tag(o.state)}</td><td class="n">${o.state==='draft'?`<button class="acc" data-${kind==='buy'?'buy':'deliver'}="${o.id}">${t(kind==='buy'?'receive':'deliver')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}

function form(id,fn){const f=$('#'+id);if(f)f.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(f)))}}
function render(){const page=location.hash.slice(1);const v=views[page]?page:'home';
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 $('#nav').innerHTML=`<b>Beauty-Grid ERP</b><small>${t('demoCo')}</small>`+PAGES.map(k=>`<a href="#${k}" class="${k===v?'on':''}">${t(k)}</a>`).join('')+`<button id="lang" class="push" lang="${L==='ar'?'en':'ar'}">${t('other')}</button><button id="reset">${t('reset')}</button>`;
 $('#view').innerHTML=views[v]();
 if(v==='products'){const draw=()=>{const q=$('#q').value.toLowerCase();$('#plist').innerHTML=S.products.filter(p=>(p.name+' '+(p.ar||'')).toLowerCase().includes(q)).map(p=>`<tr><td>${nm(p)}</td><td>${t(p.type)}</td><td class="n">${p.type==='storable'?fmt(qty(p.id))+' '+U(p):'—'}</td><td class="n">${p.price?money(p.price):'—'}</td><td class="n">${p.cost?money(p.cost):'—'}</td></tr>`).join('')};$('#q').oninput=draw;draw()}
 for(const b of document.querySelectorAll('[data-addline]')){const box=$('#'+b.dataset.addline);addLine(box,b.dataset.price==='1');b.onclick=()=>addLine(box,b.dataset.price==='1')}
 if(v==='counts'){const add=()=>{const d=document.createElement('div');d.className='row';d.style.margin='6px 0';d.innerHTML=`<label>${t('product')}<select class="cp">${opts(S.products.filter(p=>p.type==='storable'))}</select></label><label>${t('system')}<input class="cs" disabled style="width:110px"></label><label>${t('counted')}<input class="cc" type="number" min="0" step="any" style="width:110px"></label>`;const sel=d.querySelector('.cp'),f=()=>{d.querySelector('.cs').value=fmt(qty(sel.value))};sel.onchange=f;f();$('#cntlines').appendChild(d)};add();$('#cntadd').onclick=add}
 form('fprod',x=>{S.products.push({id:S.nextId++,name:x.name,type:x.type,uom:x.uom,price:+x.price,cost:+x.cost});save();toast(t('productAdded'));render()});
 form('fpart',x=>{S.partners.push({id:S.nextId++,name:x.name,phone:x.phone,customer:!!x.customer,vendor:!!x.vendor});save();toast(t('contactAdded'));render()});
 form('fbom',x=>{const lines=readLines($('#bomlines')).map(([c,q])=>[c,q]);if(!lines.length)return toast(t('addComponent'),true);S.boms.push({id:S.nextId++,product:+x.product,qty:+x.qty,lines});save();toast(t('recipeSaved'));render()});
 form('fmo',x=>{const id=nextRef('MO');S.mos.unshift({id,bom:+x.bom,qty:+x.qty,state:'draft'});save();toast(`${id} ${t('created')}`);render()});
 for(const [fid,list,k] of [['fpo','pos','PO'],['fso','sos','SO']])form(fid,x=>{const lines=readLines($('#'+fid+'-lines'));if(!x.partner)return toast(t('addContact'),true);if(!lines.length)return toast(t('addAline'),true);const id=nextRef(k);S[list].unshift({id,partner:+x.partner,lines,state:'draft'});save();toast(`${id} ${t('created')}`);render()});
 form('fcnt',()=>{const rows=[...$('#cntlines').children].filter(r=>r.querySelector('.cc').value!=='');if(!rows.length)return toast(t('enterCount'),true);const id=nextRef('CNT');
  for(const r of rows){const p=+r.querySelector('.cp').value,diff=+r.querySelector('.cc').value-qty(p);if(diff>0)move([[p,diff]],id,'Adjustment','Stock');if(diff<0)move([[p,-diff]],id,'Stock','Adjustment')}
  S.counts.unshift({id,date:new Date().toISOString(),lines:rows.length});save();toast(`${id} ${t('applied')}`);render()});
 form('fopen',x=>{S.session={id:S.sessions.length+1,open:+x.cash,cashSales:0,cart:{}};save();render()});
 form('fclose',x=>{const s=S.session,exp=s.open+s.cashSales,diff=+x.cash-exp;S.sessions.unshift({id:s.id,open:s.open,expected:exp,counted:+x.cash});S.session=null;save();toast(`${t('closedMsg')} ${money(diff)}`,diff!==0);render()});
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.id==='lang'){L=L==='ar'?'en':'ar';try{localStorage.setItem(LKEY,L)}catch(x){}render();return}
 if(b.id==='reset'){if(d.sure){S=seed();save();toast(t('resetDone'));render()}else{d.sure=1;b.textContent=t('resetSure');setTimeout(()=>{b.textContent=t('reset');delete d.sure},3000)}return}
 if(d.produce)act(()=>{const m=S.mos.find(x=>x.id===d.produce);if(missing(m).length)throw new StockError(`${t('missingC')} ${missText(m)}`);
  move(needs(m),m.id,'Stock','Production');move([[bomOf(m.bom).product,m.qty]],m.id,'Production','Stock');m.state='done'},`${d.produce} ${t('produced')}`);
 if(d.buy)act(()=>{const o=S.pos.find(x=>x.id===d.buy);move(o.lines,o.id,'Vendor','Stock');o.state='done'},`${d.buy} ${t('received')}`);
 if(d.deliver)act(()=>{const o=S.sos.find(x=>x.id===d.deliver);move(o.lines,o.id,'Stock','Customer');o.state='done'},`${d.deliver} ${t('delivered')}`);
 if(d.sell&&S.session){const c=S.session.cart||(S.session.cart={}),p=P(d.sell);if(p.type==='storable'&&(c[d.sell]||0)+1>qty(d.sell))return toast(T[L].onlyLeft(fmt(qty(d.sell)),L==='ar'&&p.ar?p.ar:p.name),true);c[d.sell]=(c[d.sell]||0)+1;save();render()}
 if(d.less){const c=S.session.cart;if(--c[d.less]<=0)delete c[d.less];save();render()}
 if(b.id==='pay')act(()=>{const s=S.session,lines=Object.entries(s.cart).map(([id,q])=>[+id,q,P(id).price]),ref=nextRef('POS');move(lines,ref,'Stock','Customer');const m=$('#method').value;S.posOrders.push({id:ref,lines,method:m});if(m==='cash')s.cashSales+=total(lines);s.cart={}},t('paid'));
});
addEventListener('hashchange',render);render();
}
</script></body></html>
