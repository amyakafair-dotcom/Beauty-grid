<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>أنماط تورنغ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* layout: preview stage on the start side, control rail on the end side; stacks on phone */
:root{
  --bg:#EFEFF6; --panel:#FFFFFF; --line:#D7D6E6; --fg:#1A1830; --muted:#625F7E; --accent:#4B3FD1;
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121120;--panel:#1B1A2C;--line:#2E2C45;--fg:#E8E7F5;--muted:#9C99B8;--accent:#8E9BFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121120;--panel:#1B1A2C;--line:#2E2C45;--fg:#E8E7F5;--muted:#9C99B8;--accent:#8E9BFF;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;max-width:1200px;margin:0 auto}
@media (max-width:820px){.app{grid-template-columns:1fr}}
.stage-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.stage{position:relative;width:100%;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0F0C2E}
.stage canvas{display:block;width:100%;height:100%}
.bar{display:flex;gap:8px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:20px;align-self:start}
h1{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:0}
h2{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;font-weight:600}
textarea{width:100%;box-sizing:border-box;min-height:72px;resize:vertical;font:500 1rem var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.hint{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:6px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:8px 0;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"],.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:30px;padding:0;display:flex;overflow:hidden}
.sw span{flex:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.row label{font-size:.88rem}
input[type=color]{width:44px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px;cursor:pointer}
</style>

<div class="app">
  <div class="stage-wrap">
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div class="bar">
      <button id="play" type="button">إيقاف</button>
      <button id="replay" type="button">إعادة</button>
    </div>
  </div>

  <aside class="panel">
    <h1>أنماط تورنغ</h1>
    <section>
      <h2>النص</h2>
      <textarea id="txt" maxlength="24" placeholder="اكتب كلمة قصيرة…">Indigo</textarea>
      <div class="hint"><span>كلمة أو كلمتان تعطي نمطاً أوضح.</span><span id="count">0/24</span></div>
    </section>
    <section>
      <h2>نسبة العرض</h2>
      <div class="seg" id="ar">
        <button type="button" data-ar="1/1">1:1</button>
        <button type="button" data-ar="4/5">4:5</button>
        <button type="button" data-ar="9/16" aria-pressed="true">9:16</button>
        <button type="button" data-ar="16/9">16:9</button>
      </div>
    </section>
    <section>
      <h2>النمط</h2>
      <div class="seg" id="pat">
        <button type="button" data-p="0" aria-pressed="true">مرجان</button>
        <button type="button" data-p="1">متاهة</button>
        <button type="button" data-p="2">نقاط</button>
        <button type="button" data-p="3">بصمة</button>
      </div>
    </section>
    <section>
      <h2>الألوان</h2>
      <div class="sws" id="presets"></div>
      <div class="row"><label for="cbg">الخلفية</label><input type="color" id="cbg"></div>
      <div class="row"><label for="cp">النمط</label><input type="color" id="cp"></div>
    </section>
  </aside>
</div>

<script>
const PRESETS=[
  {bg:'#0F0C2E',p:'#8E9BFF'},
  {bg:'#F3F1FA',p:'#3B2FB0'},
  {bg:'#0B1A16',p:'#43E0A4'},
  {bg:'#1A0F0A',p:'#FF8A3D'},
  {bg:'#F6F0E4',p:'#C0392B'},
  {bg:'#111111',p:'#F5F5F5'},
];
// Gray-Scott feed/kill pairs: coral, maze, spots, fingerprint
const PATTERNS=[[.0545,.062],[.029,.057],[.035,.065],[.037,.06]];
const OUT=[.02,.075]; // outside the letters B dies, so growth stays inside the text
const GROW=4200,HOLD=2.5,ITER=12,CELLS=90000;

const $=id=>document.getElementById(id);
const S={text:$('txt').value,ar:9/16,col:{...PRESETS[0]},pat:0,seed:11};
const isAr=s=>/[؀-ۿ]/.test(s);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

const cv=$('cv'),ctx=cv.getContext('2d');
let W,H,A,B,A2,B2,F,K,mask,img,iters=0,holdT=0;

function makeMask(){
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const lines=S.text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length){
    let fs=100;const font=s=>`900 ${s}px Cairo, "IBM Plex Sans Arabic", system-ui, sans-serif`;
    x.font=font(fs);
    const tw=Math.max(...lines.map(l=>x.measureText(l).width));
    fs=Math.min(fs*W*.86/tw,H*.6/(lines.length*1.15));
    x.font=font(fs);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
    const lh=fs*1.15,top=H/2-lh*lines.length/2;
    lines.forEach((l,i)=>{x.direction=isAr(l)?'rtl':'ltr';x.fillText(l,W/2,top+lh*(i+.5))});
  }
  const d=x.getImageData(0,0,W,H).data;mask=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)mask[i]=d[i*4+3]>128?1:0;
}
function setRates(){
  const [f,k]=PATTERNS[S.pat];
  for(let i=0;i<W*H;i++){F[i]=mask[i]?f:OUT[0];K[i]=mask[i]?k:OUT[1]}
}
function seed(){
  A.fill(1);B.fill(0);
  const r=rng(S.seed),inside=[];
  for(let i=0;i<W*H;i++)if(mask[i])inside.push(i);
  const n=Math.max(4,Math.round(inside.length/300));
  for(let s=0;s<n&&inside.length;s++){
    const c=inside[Math.floor(r()*inside.length)],cx=c%W,cy=(c-cx)/W;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const j=(cy+dy)*W+cx+dx;if(j>=0&&j<W*H)B[j]=1}
  }
  iters=0;holdT=0;
}
function build(){
  W=Math.round(Math.sqrt(CELLS*S.ar));H=Math.round(W/S.ar);
  cv.width=W;cv.height=H;img=ctx.createImageData(W,H);
  const n=W*H;A=new Float32Array(n);B=new Float32Array(n);A2=new Float32Array(n);B2=new Float32Array(n);F=new Float32Array(n);K=new Float32Array(n);
  makeMask();setRates();seed();
  if(reduced){for(let i=0;i<GROW;i++)step();iters=GROW}
  draw();
}
function step(){
  for(let y=1;y<H-1;y++){const row=y*W;for(let x=1;x<W-1;x++){const i=row+x;
    const a=A[i],b=B[i];
    const la=-a+.2*(A[i-1]+A[i+1]+A[i-W]+A[i+W])+.05*(A[i-W-1]+A[i-W+1]+A[i+W-1]+A[i+W+1]);
    const lb=-b+.2*(B[i-1]+B[i+1]+B[i-W]+B[i+W])+.05*(B[i-W-1]+B[i-W+1]+B[i+W-1]+B[i+W+1]);
    const abb=a*b*b,f=F[i];
    A2[i]=Math.min(1,Math.max(0,a+la-abb+f*(1-a)));
    B2[i]=Math.min(1,Math.max(0,b+.5*lb+abb-(K[i]+f)*b));
  }}
  [A,A2]=[A2,A];[B,B2]=[B2,B];
}
function draw(){
  const bg=hex(S.col.bg),p=hex(S.col.p),d=img.data;
  for(let i=0;i<W*H;i++){
    let v=Math.min(1,Math.max(0,(B[i]-.08)*4.5));
    if(mask[i]&&v<.08)v=.08; // faint ghost of the letters before the pattern arrives
    const o=i*4;d[o]=bg[0]+(p[0]-bg[0])*v;d[o+1]=bg[1]+(p[1]-bg[1])*v;d[o+2]=bg[2]+(p[2]-bg[2])*v;d[o+3]=255;
  }
  ctx.putImageData(img,0,0);
}

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing=!reduced,last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(playing&&W){
    for(let i=0;i<ITER;i++)step();
    iters+=ITER;
    if(iters>=GROW){holdT+=dt;if(holdT>HOLD)seed()}
    draw();
  }
  requestAnimationFrame(frame);
}

function setAR(ar){S.ar=ar;const st=$('stage');st.style.aspectRatio=String(ar);st.style.width=`min(100%, calc(78vh * ${ar}))`;build()}

// ---- controls
const syncColorInputs=()=>{$('cbg').value=S.col.bg;$('cp').value=S.col.p;$('stage').style.background=S.col.bg};
const count=()=>$('count').textContent=`${$('txt').value.length}/24`;
const press=(group,btn)=>[...group.children].forEach(x=>x.setAttribute('aria-pressed',x===btn));
let deb;
$('txt').addEventListener('input',e=>{S.text=e.target.value;count();clearTimeout(deb);deb=setTimeout(build,350)});
$('ar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;press($('ar'),b);const [a,c]=b.dataset.ar.split('/');setAR(a/c)});
$('pat').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;press($('pat'),b);S.pat=+b.dataset.p;setRates()});
PRESETS.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='sw';b.setAttribute('aria-label','لوحة ألوان '+(i+1));
  b.setAttribute('aria-pressed',i===0);b.innerHTML=`<span style="background:${p.bg}"></span><span style="background:${p.p}"></span>`;
  b.onclick=()=>{press($('presets'),b);S.col={...p};syncColorInputs();draw()};
  $('presets').appendChild(b)});
const pick=(id,key)=>$(id).addEventListener('input',e=>{S.col[key]=e.target.value;press($('presets'),null);syncColorInputs();draw()});
pick('cbg','bg');pick('cp','p');
$('replay').onclick=()=>{seed();playing=true;$('play').textContent='إيقاف'};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'إيقاف':'تشغيل'};
if(!playing)$('play').textContent='تشغيل';

syncColorInputs();count();
(async()=>{try{await document.fonts.load('900 100px Cairo',S.text||'a')}catch(e){}setAR(9/16);requestAnimationFrame(frame)})();
</script>

</body></html>
